<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIGIB 03</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- LOGIN -->

    <section id="login">

        <h1>🚒 SIGIB 03</h1>

        <p>
            Sistema Integral de Gestión de Inventario Bomberos
        </p>


        <input 
            type="number"
            id="legajo"
            placeholder="Ingrese su legajo"
        >


        <button onclick="ingresar()">
            Ingresar
        </button>


    </section>




    <!-- PANEL PRINCIPAL -->

    <main id="panel" style="display:none;">


        <header>

            <h1>
                🚒 SIGIB 03
            </h1>

            <p>
                Panel principal
            </p>

        </header>



        <h2>
            Áreas
        </h2>



        <div class="modulos">


            <button onclick="abrirModulo('🚒 Equipamiento estructural')">
                🚒 Incendio estructural
            </button>


            <button onclick="abrirModulo('🌲 Incendio forestal')">
                🌲 Incendio forestal
            </button>


            <button onclick="abrirModulo('🚗 Rescate vehicular')">
                🚗 Rescate vehicular
            </button>


            <button onclick="abrirModulo('🩺 Trauma')">
                🩺 Trauma
            </button>


            <button onclick="abrirModulo('🌊 Rescate acuático')">
                🌊 Rescate acuático
            </button>


            <button onclick="abrirModulo('🪢 GRIMP')">
                🪢 G.R.I.M.P.
            </button>


            <button onclick="abrirModulo('🫁 ERA')">
                🫁 Equipos de Respiración Autónoma (E.R.A.)
            </button>


            <button onclick="abrirModulo('👕 Ropería')">
                👕 Ropería
            </button>


            <button onclick="abrirModulo('⚙️ Equipos a explosión')">
                ⚙️ Equipos a explosión
            </button>


        </div>


    </main>



    <footer>

        <p>
            SIGIB 03 - Sistema de Gestión de Inventario
        </p>

    </footer>




    <script src="datos.js"></script>

    <script src="app.js"></script>


</body>

</html>
